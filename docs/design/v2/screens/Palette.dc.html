<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>InfraDesk · 빠른 실행</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1E1F22}
a{color:#79A3F2;text-decoration:none}a:hover{color:#A9C4F7}
button{font:inherit;cursor:pointer}
.pi:hover{background:#34373C}
</style>
</helmet>
<div style="min-height: 100vh; position: relative; display: flex; flex-direction: column; background: #1E1F22; color: #DFE1E5; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px; line-height: 1.45; overflow: hidden">

  <div aria-hidden="true" style="height: 44px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #2B2D30; border-bottom: 1px solid #393B40">
    <span style="width: 110px; height: 12px; border-radius: 6px; background: #43454A"></span>
    <span style="flex: 0 1 420px; height: 30px; border-radius: 6px; border: 1px solid #43454A"></span>
  </div>
  <div aria-hidden="true" style="flex: 1; display: flex">
    <div style="width: 240px; flex: none; background: #2B2D30; border-right: 1px solid #393B40; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px">
      <span style="height: 12px; width: 70%; border-radius: 6px; background: #393B40"></span>
      <span style="height: 12px; width: 55%; border-radius: 6px; background: #393B40"></span>
      <span style="height: 12px; width: 80%; border-radius: 6px; background: #393B40"></span>
      <span style="height: 12px; width: 60%; border-radius: 6px; background: #393B40"></span>
      <span style="height: 12px; width: 75%; border-radius: 6px; background: #393B40"></span>
    </div>
    <div style="flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px">
      <span style="height: 20px; width: 220px; border-radius: 6px; background: #393B40"></span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <span style="height: 120px; border-radius: 8px; background: #2B2D30"></span>
        <span style="height: 120px; border-radius: 8px; background: #2B2D30"></span>
        <span style="height: 120px; border-radius: 8px; background: #2B2D30"></span>
        <span style="height: 120px; border-radius: 8px; background: #2B2D30"></span>
      </div>
      <span style="height: 260px; border-radius: 8px; background: #2B2D30"></span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(10, 11, 13, 0.62); display: flex; justify-content: center; align-items: flex-start; padding: 72px 16px 16px; box-sizing: border-box">
    <div role="dialog" aria-label="빠른 실행" style="width: 640px; max-width: 100%; border-radius: 12px; background: #2B2D30; border: 1px solid #4E5157; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 52px; border-bottom: 1px solid #393B40">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B4B8BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" aria-label="서버, 작업, 명령어 찾기" placeholder="서버, 작업, 저장된 명령어 찾기" value="{{q}}" onChange="{{setQ}}" style="flex: 1; min-width: 0; height: 36px; border: none; outline: none; background: transparent; color: #DFE1E5; font: inherit; font-size: 15px">
        <a href="Server.dc.html" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B4B8BF; border: 1px solid #4E5157; border-radius: 4px; padding: 1px 6px">esc</a>
      </div>

      <div style="max-height: 470px; overflow: auto; padding: 6px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <div style="padding: 10px 10px 4px; font-size: 11.5px; font-weight: 600; color: #9A9DA3">{{g.label}}</div>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="{{it.href}}" class="pi" style="{{it.rowStyle}}">
              <span style="width: 26px; height: 26px; flex: none; border-radius: 6px; background: #1E1F22; border: 1px solid #43454A; display: inline-flex; align-items: center; justify-content: center; color: #B4B8BF">
                <sc-if value="{{it.isServer}}" hint-placeholder-val="{{true}}"><span style="{{it.dotStyle}}"></span></sc-if>
                <sc-if value="{{it.isAction}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></sc-if>
                <sc-if value="{{it.isCmd}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg></sc-if>
                <sc-if value="{{it.isNav}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0">
                <span style="display: block; color: #DFE1E5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.label}}</span>
                <span style="{{it.subStyle}}">{{it.sub}}</span>
              </span>
              <sc-if value="{{it.hasKbd}}" hint-placeholder-val="{{false}}"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #B4B8BF; border: 1px solid #4E5157; border-radius: 4px; padding: 1px 6px">{{it.kbd}}</kbd></sc-if>
            </a>
          </sc-for>
        </sc-for>
        <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
          <div style="padding: 28px 12px; text-align: center; color: #B4B8BF">'{{q}}'와 맞는 항목이 없어요</div>
        </sc-if>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 9px 14px; border-top: 1px solid #393B40; font-size: 11.5px; color: #9A9DA3">
        <span>↑↓ 이동</span>
        <span>↵ 실행</span>
        <span>⌘↵ 새 터미널 탭에서</span>
        <span>esc 닫기</span>
        <span style="flex: 1"></span>
        <span>위험한 작업은 확인 창을 한 번 더 거쳐요</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'web' };
  }
  renderVals() {
    const q = (this.state.q || '').trim().toLowerCase();
    const mono = "display: block; font-size: 12px; color: #9A9DA3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'JetBrains Mono', monospace;";
    const plain = 'display: block; font-size: 12px; color: #9A9DA3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;';
    const all = [
      { g: '서버', kind: 'server', label: 'web-server', sub: '계정 B · 서울 · 실행 중 · 디스크 91%', href: 'Server.dc.html', run: true },
      { g: '서버', kind: 'server', label: 'discord-bot', sub: '계정 A · 춘천 · 실행 중 · 컨테이너 1개 멈춤', href: 'Server.dc.html', run: true },
      { g: '서버', kind: 'server', label: 'api-gateway', sub: '계정 A · 춘천 · 실행 중', href: 'Server.dc.html', run: true },
      { g: '서버', kind: 'server', label: 'mac-mini', sub: '직접 연결 · 실행 중', href: 'Server.dc.html', run: true },
      { g: '서버', kind: 'server', label: 'batch-worker', sub: '계정 A · 춘천 · 정지됨', href: 'Server.dc.html', run: false },
      { g: 'web-server 작업', kind: 'action', label: 'SSH 터미널 열기', sub: 'web-server', key: 'web-server ssh', href: 'Terminal.dc.html', kbd: '⌘T' },
      { g: 'web-server 작업', kind: 'action', label: '파일 열기 (SFTP)', sub: 'web-server · /home/ubuntu', key: 'web-server sftp', href: 'Files.dc.html' },
      { g: 'web-server 작업', kind: 'action', label: '모니터링 보기', sub: 'web-server · 최근 1시간', key: 'web-server chart', href: 'Monitor.dc.html' },
      { g: 'web-server 작업', kind: 'action', label: '재부팅…', sub: 'web-server · 확인 창을 거쳐요', key: 'web-server reboot', href: 'Dialogs.dc.html' },
      { g: '저장된 명령어', kind: 'cmd', label: '디스크 확인', sub: 'df -h && du -sh /var/lib/docker  →  web-server에서 실행', key: 'web-server disk', href: 'Terminal.dc.html', mono: true },
      { g: '저장된 명령어', kind: 'cmd', label: '봇 로그 보기', sub: 'docker logs -f --tail 100 bot-app', key: 'discord-bot log', href: 'Terminal.dc.html', mono: true },
      { g: '에이전트', kind: 'nav', label: '에이전트에게 묻기', sub: 'web-server에 대해 · 명령은 허용해야 실행돼요', key: 'web-server agent ai', href: 'AgentDock.dc.html', kbd: '⌘J' },
      { g: '이동', kind: 'nav', label: '개요', sub: '서버 전체', href: 'Main.dc.html' },
      { g: '이동', kind: 'nav', label: '활동 기록', sub: '작업·알림 기록', href: 'Activity.dc.html', kbd: '⌘⇧A' },
      { g: '이동', kind: 'nav', label: '설정', sub: '알림 · 연결 · 에이전트 · 앱 정보', key: 'settings', href: 'Settings.dc.html', kbd: '⌘,' }
    ];
    const hits = all.filter(it => !q || (it.label + ' ' + it.sub + ' ' + (it.key || '') + ' ' + it.g).toLowerCase().includes(q));
    const order = [];
    hits.forEach(it => { if (!order.includes(it.g)) order.push(it.g); });
    let first = true;
    const groups = order.map(name => ({
      label: name,
      items: hits.filter(it => it.g === name).map(it => {
        const sel = first; first = false;
        return {
          label: it.label, sub: it.sub, href: it.href, kbd: it.kbd || '', hasKbd: !!it.kbd,
          isServer: it.kind === 'server', isAction: it.kind === 'action', isCmd: it.kind === 'cmd', isNav: it.kind === 'nav',
          dotStyle: it.run ? 'width: 8px; height: 8px; border-radius: 50%; background: #5FB865;' : 'width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid #9A9DA3;',
          subStyle: it.mono ? mono : plain,
          rowStyle: 'display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: #DFE1E5;' + (sel ? ' background: #2E436E;' : '')
        };
      })
    }));
    return {
      q: this.state.q,
      setQ: (e) => this.setState({ q: e.target.value }),
      groups,
      empty: hits.length === 0
    };
  }
}
</script>
</body>
</html>
