name: build

# Builds only on pushes to main (or a manual run), then publishes the result to the
# rolling "beta" pre-release: same download links every time, replaced by each build.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: dmg
            built: build/dist/*.dmg
            asset: InfraDesk-beta-macOS.dmg
          - os: windows-latest
            task: windowsZip
            built: build/dist/*.zip
            asset: InfraDesk-beta-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        shell: bash
        run: ./gradlew test
      - name: Package (includes --self-test of the packaged app)
        shell: bash
        run: ./gradlew ${{ matrix.task }}
      - name: Name for the beta release
        shell: bash
        run: mkdir -p out && mv ${{ matrix.built }} "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  beta-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          {
            echo "> ⚠️ **베타 버전**이에요. \`main\`에 푸시될 때마다 이 파일들이 최신 빌드로 바뀝니다."
            echo ">"
            echo "> 빌드 #${GITHUB_RUN_NUMBER} · 커밋 [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            cat .github/release-notes.md
          } > notes.md
      - name: Move the beta tag to this commit
        run: |
          git tag -f beta "$GITHUB_SHA"
          git push -f origin refs/tags/beta
      - name: Publish
        run: |
          title="InfraDesk 1.0.0 Beta (빌드 ${GITHUB_RUN_NUMBER})"
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta --title "$title" --notes-file notes.md --prerelease
            gh release upload beta dist/* --clobber
          else
            gh release create beta dist/* --title "$title" --notes-file notes.md --prerelease
          fi
