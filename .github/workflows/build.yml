name: build

# Builds only on pushes to main (or a manual run), then publishes the result to the
# rolling "beta" pre-release: same download links every time, replaced by each build.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "renames" maps each built file to its fixed name in the beta release.
          - os: macos-latest
            tasks: dmg macUpdateZip
            renames: "build/dist/*.dmg=InfraDesk-beta-macOS.dmg build/dist/*-macOS.zip=InfraDesk-beta-macOS.zip"
            artifact: macos
          - os: windows-latest
            tasks: windowsZip
            renames: "build/dist/*-windows.zip=InfraDesk-beta-windows.zip"
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build metadata
        shell: bash
        run: echo "BUILD_ARGS=-PbuildNumber=${GITHUB_RUN_NUMBER} -Pcommit=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: ./gradlew test $BUILD_ARGS
      - name: Report failed tests as annotations
        if: failure()
        shell: bash
        run: |
          PY=$(command -v python || command -v python3)
          "$PY" - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("build/test-results/test/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (bad.get("message") or "").replace("\n", " ")[:400]
                      print(f"::error title=Test failed::{case.get('classname')}.{case.get('name')}: {msg}")
          PYEOF
      - name: Package (includes --self-test of the packaged app)
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} $BUILD_ARGS
      - name: Name for the beta release
        shell: bash
        run: |
          mkdir -p out
          for pair in ${{ matrix.renames }}; do
            mv ${pair%%=*} "out/${pair#*=}"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  # Two kinds of release per build:
  #   beta     rolling "latest" pointer: fixed download links, and what installed apps check for updates
  #   beta-N   permanent archive of build N (kept until delete-beta-archives.yml is run by hand)
  beta-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history for the change list
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: App version from the run number (keep 15 = runOffset in build.gradle.kts)
        run: |
          n=$(( BUILD - 15 )); [ "$n" -lt 0 ] && n=0
          echo "VERSION=1.$(( n / 10 )).$(( n % 10 ))" >> "$GITHUB_ENV"
      - name: Checksums (the app verifies its update download against these)
        run: |
          cd dist
          sha256sum InfraDesk-beta-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Archive the build currently in "beta" if it has no beta-N release yet
        run: |
          # Errors go to an annotation too: those are readable without signing in, logs are not.
          archive() {
            set -ex
            prev=$(gh release view beta --json name -q .name | grep -o '빌드 [0-9]*' | grep -o '[0-9]*' || true)
            if [ -z "$prev" ] || [ "$prev" = "$BUILD" ]; then
              echo "nothing to archive (prev=$prev)"
              return 0
            fi
            # A failed earlier attempt can leave a draft behind (gh uploads to a draft, then publishes).
            draft=$(gh release view "beta-$prev" --json isDraft -q .isDraft 2>/dev/null || echo missing)
            if [ "$draft" = "false" ]; then
              echo "beta-$prev already archived"
              return 0
            fi
            if [ "$draft" = "true" ]; then
              gh release delete "beta-$prev" --yes
            fi
            target=$(git rev-list -n 1 beta)
            mkdir -p prev
            gh release download beta -D prev
            prevTitle=$(gh release view beta --json name -q .name)
            gh release view beta --json body -q .body > prev-notes.md
            gh release create "beta-$prev" prev/* --target "$target" \
              --title "$prevTitle" --notes-file prev-notes.md --prerelease
            git fetch --tags --force
          }
          if ! (archive) > archive.log 2>&1; then
            cat archive.log
            echo "::error title=Archiving the previous build failed::$(tail -n 8 archive.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          cat archive.log
      - name: Release notes
        run: |
          last=$(git tag -l 'beta-[0-9]*' --sort=-v:refname | grep -v "^beta-${BUILD}$" | head -1)
          {
            echo "> ⚠️ **베타 버전**이에요. 빌드 #${BUILD} · 커밋 [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ">"
            echo "> 최신 빌드는 [\`beta\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/beta), 지난 빌드는 \`beta-<번호>\` 릴리스에 모두 남아 있어요."
            echo
            if [ -n "$last" ]; then
              echo "## 바뀐 점 (${last} 이후)"
              git log --no-merges --pretty='- %s ([`%h`]('"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"'/commit/%H))' "${last}..${GITHUB_SHA}"
              echo
            fi
            cat .github/release-notes.md
          } > notes.md
          cat notes.md
      - name: Move the beta tag to this commit
        run: |
          git tag -f beta "$GITHUB_SHA"
          git push -f origin refs/tags/beta
      - name: Publish the rolling beta
        run: |
          title="InfraDesk ${VERSION} Beta (빌드 ${BUILD})"
          if gh release view beta >/dev/null 2>&1; then
            gh release edit beta --title "$title" --notes-file notes.md --prerelease
            gh release upload beta dist/* --clobber
          else
            gh release create beta dist/* --title "$title" --notes-file notes.md --prerelease
          fi
      - name: Archive this build as beta-N
        run: |
          if gh release view "beta-$BUILD" >/dev/null 2>&1; then
            gh release upload "beta-$BUILD" dist/* --clobber
          else
            gh release create "beta-$BUILD" dist/* --target "$GITHUB_SHA" \
              --title "InfraDesk ${VERSION} Beta (빌드 ${BUILD})" --notes-file notes.md --prerelease
          fi
